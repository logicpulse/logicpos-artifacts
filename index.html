<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Download Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        p {
            font-size: 14px;
            color: #777;
            margin-bottom: 30px;
        }

        .download-btn {
            display: inline-block;
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 500;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.6);
        }

        .download-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Artifacts</h1>
        <p>Click below to download the artifacts you want</p>
        <a href="api-update.zip" download class="download-btn">⬇ API Update ZIP</a>
        <br/><br/>
         <a href="pos-update.zip" download class="download-btn">⬇ POS Update ZIP</a>
    </div>

    <footer>
        © 2026 Logicpulse Technologies. All rights reserved.
    </footer>

</body>
</html>
